<mat-toolbar color="primary" class="toolbar">
  <span class="brand">To-Do List</span>
  <span class="spacer"></span>
  <nav>
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Dashboard">
      <mat-icon>dashboard</mat-icon>
      <span class="label">Dashboard</span>
    </a>
    <a mat-button routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Tarefas">
      <mat-icon>list</mat-icon>
      <span class="label">Tarefas</span>
    </a>
    <a mat-flat-button routerLink="/tasks/new" aria-label="Nova tarefa">
      <mat-icon>add</mat-icon>
      <span class="label">Nova tarefa</span>
    </a>
  </nav>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
